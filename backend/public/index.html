<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hair Color Try-on</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0b1020; color:#fff; margin:0; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 18px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .muted { color: rgba(255,255,255,0.65); font-size: 13px; }
    label { display:block; margin-top: 14px; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.8); }
    input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.35); color:#fff; font-size: 14px; }
    button { cursor:pointer; background:#6d7cff; border:none; font-weight: 700; margin-top: 14px; }
    button:disabled { opacity: 0.5; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .imgbox { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; padding: 12px; }
    img { width:100%; border-radius: 12px; display:block; }
    pre { white-space: pre-wrap; background: rgba(0,0,0,0.35); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); overflow:auto; }
    .row { display:flex; gap: 10px; }
    .row > * { flex:1; }
    .pill { display:inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,0.10); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🎨 Hair Color Try-On</h1>
      <div class="muted">Fast + clean: Replicate hair mask → local recolor (no face changes).</div>

      <label>User Image URL</label>
      <input id="userImageUrl" type="text" value="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=700"/>

      <div class="row">
        <div>
          <label>Hair Color Preset</label>
          <select id="colorSelect">
            <option value="">Loading colors…</option>
          </select>
        </div>
        <div>
          <label>API Base</label>
          <input id="apiBase" type="text" value="http://localhost:4000"/>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Optional: Custom Hex (overrides preset)</label>
          <input id="hex" type="text" placeholder="#RRGGBB (e.g. #ffcc66)"/>
        </div>
        <div>
          <label>Strength (0.0 to 1.0)</label>
          <input id="strength" type="text" placeholder="leave blank to use preset default"/>
        </div>
      </div>

      <button id="runBtn">✨ Apply Hair Color</button>

      <div class="grid">
        <div class="imgbox">
          <div class="muted" style="margin-bottom:8px;">Original</div>
          <img id="origImg" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=700" alt="Original"/>
        </div>
        <div class="imgbox">
          <div class="muted" style="margin-bottom:8px;">Edited</div>
          <img id="editedImg" src="" alt="Edited" style="display:none;"/>
          <div id="placeholder" class="muted">Pick a color and run.</div>
        </div>
      </div>

      <label style="margin-top:16px;">Result <span class="pill">includes maskUrl</span></label>
      <pre id="out">Waiting…</pre>
    </div>
  </div>

<script>
  const colorSelect = document.getElementById('colorSelect');
  const runBtn = document.getElementById('runBtn');
  const out = document.getElementById('out');
  const origImg = document.getElementById('origImg');
  const editedImg = document.getElementById('editedImg');
  const placeholder = document.getElementById('placeholder');

  async function loadColors() {
    const base = document.getElementById('apiBase').value.trim();
    const resp = await fetch(`${base}/api/hair-colors`);
    const data = await resp.json();

    colorSelect.innerHTML = '<option value="">Select a color</option>';
    (data.colors || []).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = `${c.name} (${c.hex})`;
      colorSelect.appendChild(opt);
    });
  }

  runBtn.addEventListener('click', async () => {
    const base = document.getElementById('apiBase').value.trim();
    const userImageUrl = document.getElementById('userImageUrl').value.trim();
    const colorId = colorSelect.value;
    const hex = document.getElementById('hex').value.trim();
    const strengthRaw = document.getElementById('strength').value.trim();
    const strength = strengthRaw ? Number(strengthRaw) : undefined;

    if (!userImageUrl) return alert('Add a userImageUrl');
    if (!colorId && !hex) return alert('Pick a preset color or enter a hex');

    runBtn.disabled = true;
    runBtn.textContent = 'Working…';
    out.textContent = 'Calling server…';
    origImg.src = userImageUrl;

    editedImg.style.display = 'none';
    placeholder.style.display = 'block';

    try {
      const resp = await fetch(`${base}/api/recolor-hair`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userImageUrl, colorId: colorId || undefined, hex: hex || undefined, strength })
      });

      const data = await resp.json();
      out.textContent = JSON.stringify(data, null, 2);

      if (data.success && data.editedImageDataUri) {
        editedImg.src = data.editedImageDataUri;
        editedImg.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        placeholder.style.display = 'block';
      }
    } catch (e) {
      out.textContent = `Error: ${e.message}`;
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = '✨ Apply Hair Color';
    }
  });

  document.getElementById('userImageUrl').addEventListener('change', (e) => {
    origImg.src = e.target.value;
  });

  loadColors().catch(err => {
    colorSelect.innerHTML = '<option value="">Failed to load colors</option>';
    out.textContent = 'Color load error: ' + err.message;
  });
</script>
</body>
</html>
