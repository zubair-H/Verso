<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preset Hair Try-on</title></head><body></body></html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Preset Hair Try-on</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#0b1020; color:#fff; margin:0; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 18px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .muted { color: rgba(255,255,255,0.65); font-size: 13px; }
    label { display:block; margin-top: 14px; margin-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.8); }
    input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.35); color:#fff; font-size: 14px; }
    button { cursor:pointer; background:#6d7cff; border:none; font-weight: 700; margin-top: 14px; }
    button:disabled { opacity: 0.5; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .imgbox { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; padding: 12px; }
    img { width:100%; border-radius: 12px; display:block; }
    pre { white-space: pre-wrap; background: rgba(0,0,0,0.35); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); overflow:auto; }
    .row { display:flex; gap: 10px; }
    .row > * { flex:1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>💇 Preset Hair Try-On</h1>
      <div class="muted">This version uses: hair mask → SDXL inpainting. Much closer to App Store quality.</div>

      <label>User Image URL</label>
      <input id="userImageUrl" type="text" value="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=700"/>

      <div class="row">
        <div>
          <label>Preset</label>
          <select id="presetSelect">
            <option value="">Loading presets…</option>
          </select>
        </div>
        <div>
          <label>API Base</label>
          <input id="apiBase" type="text" value="http://localhost:4000"/>
        </div>
      </div>

      <button id="runBtn">✨ Try On</button>

      <div class="grid">
        <div class="imgbox">
          <div class="muted" style="margin-bottom:8px;">Original</div>
          <img id="origImg" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=700" alt="Original"/>
        </div>
        <div class="imgbox">
          <div class="muted" style="margin-bottom:8px;">Edited</div>
          <img id="editedImg" src="" alt="Edited" style="display:none;"/>
          <div id="placeholder" class="muted">Run a preset to generate.</div>
        </div>
      </div>

      <label>Result</label>
      <pre id="out">Waiting…</pre>
    </div>
  </div>

<script>
  const presetSelect = document.getElementById('presetSelect');
  const runBtn = document.getElementById('runBtn');
  const out = document.getElementById('out');
  const origImg = document.getElementById('origImg');
  const editedImg = document.getElementById('editedImg');
  const placeholder = document.getElementById('placeholder');

  async function loadPresets() {
    const base = document.getElementById('apiBase').value.trim();
    const resp = await fetch(`${base}/api/presets`);
    const data = await resp.json();
    presetSelect.innerHTML = '<option value="">Select a preset</option>';
    (data.presets || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      presetSelect.appendChild(opt);
    });
  }

  runBtn.addEventListener('click', async () => {
    const base = document.getElementById('apiBase').value.trim();
    const userImageUrl = document.getElementById('userImageUrl').value.trim();
    const presetId = presetSelect.value;

    if (!userImageUrl) return alert('Add a userImageUrl');
    if (!presetId) return alert('Pick a preset');

    runBtn.disabled = true;
    runBtn.textContent = 'Running…';
    out.textContent = 'Calling server…';
    origImg.src = userImageUrl;

    editedImg.style.display = 'none';
    placeholder.style.display = 'block';

    try {
      const resp = await fetch(`${base}/api/try-on`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userImageUrl, presetId })
      });

      const data = await resp.json();
      out.textContent = JSON.stringify(data, null, 2);

      if (data.success && data.editedImageUrl) {
        editedImg.src = data.editedImageUrl;
        editedImg.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        placeholder.style.display = 'block';
      }
    } catch (e) {
      out.textContent = `Error: ${e.message}`;
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = '✨ Try On';
    }
  });

  document.getElementById('userImageUrl').addEventListener('change', (e) => {
    origImg.src = e.target.value;
  });

  loadPresets().catch(err => {
    presetSelect.innerHTML = '<option value="">Failed to load presets</option>';
    out.textContent = 'Preset load error: ' + err.message;
  });
</script>
</body>
</html>
